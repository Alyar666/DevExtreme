<body class="dx-surface">
    <div role="main">
        <h1 style="position: fixed; left: 0; top: 0; clip: rect(1px, 1px, 1px, 1px);">Test header</h1>

        <select id="theme-selector" style="display: block;">
        </select>
        <br />
        <div id="numberbox"></div>
        <div id="btn"></div>
        <div id="gridContainer"></div>
        <script>
 $(() => {
  const pageSize = 20;
  const grid = $('#gridContainer').dxDataGrid({
    dataSource: DevExpress.data.AspNet.createStore({
      key: 'Id',
      loadUrl: 'https://js.devexpress.com/Demos/WidgetsGalleryDataService/api/Sales',
    }),
    width: 900,
    height: 300,
    selection: { mode: 'multiple' },
		searchPanel: { visible: true },
    remoteOperations: true,
    scrolling: {
      mode: 'virtual',
      useNative: false,
    },
    paging: {
      pageSize,
    },
    headerFilter: {
      visible: true,
      search: {
        enabled: true,
      },
    },
    wordWrapEnabled: true,
    showBorders: true,
    columns: [{
      dataField: 'Id',
      width: 90,
    }, {
      caption: 'Store',
      dataField: 'StoreName',
      width: 150,
    }, {
      caption: 'Category',
      dataField: 'ProductCategoryName',
      width: 120,
    }, {
      caption: 'Product',
      dataField: 'ProductName',
    }, {
      caption: 'Date',
      dataField: 'DateKey',
      dataType: 'date',
      format: 'yyyy-MM-dd',
      width: 110,
    }, {
      caption: 'Amount',
      dataField: 'SalesAmount',
      format: 'currency',
      headerFilter: {
        groupInterval: 1000,
      },
      width: 100,
    }],
  }).dxDataGrid('instance');

  var numberbox = $('#numberbox').dxNumberBox({
    value: 61
  }).dxNumberBox('instance');
   
  $('#btn').dxButton({
    text: `Select record`,
    onClick() {
      const key = numberbox.option('value');
      const pageIndex = key/pageSize - 1;
      grid.pageIndex(pageIndex).then(() => {
        grid.navigateToRow(key).then(() => {
          grid.selectRows([key], false);
        });
      });
    }
  })
});
        </script>
    </div>
