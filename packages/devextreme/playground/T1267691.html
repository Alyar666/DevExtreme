<body class="dx-surface">
    <div role="main">
        <h1 style="position: fixed; left: 0; top: 0; clip: rect(1px, 1px, 1px, 1px);">Test header</h1>

        <select id="theme-selector" style="display: block;">
        </select>
        <br />

        <div id="btn"></div>
        <br/><br/>
        <div id="gridContainer"></div>
        <script>
$(() => {
  $('#btn').dxButton({
    text: 'Scroll grid',
    onClick: function() {
      $('#gridContainer').dxDataGrid('instance').getScrollable().scrollTo({
        y: 5000000
      });
    }
  });

  $('#gridContainer').dxDataGrid({
    editing: {
    	mode: "row",
    	allowAdding: true,
        newRowPosition: "first"
  	},
    dataSource: DevExpress.data.AspNet.createStore({
      key: 'Id',
      loadUrl: 'https://js.devexpress.com/Demos/WidgetsGalleryDataService/api/Sales',
    }),
    paging: {
      pageSize: 35
    },
    remoteOperations: true,
    scrolling: {
      mode: 'virtual',
      //legacyMode: true,
    },
    showBorders: true,
    columns: [{
      dataField: 'Id',
      width: 90,
    }, {
      caption: 'Store',
      dataField: 'StoreName',
      width: 150,
    }, {
      caption: 'Category',
      dataField: 'ProductCategoryName',
      width: 120,
    }, {
      caption: 'Product',
      dataField: 'ProductName',
    }, {
      caption: 'Date',
      dataField: 'DateKey',
      dataType: 'date',
      format: 'yyyy-MM-dd',
      width: 110,
    }, {
      caption: 'Amount',
      dataField: 'SalesAmount',
      format: 'currency',
      headerFilter: {
        groupInterval: 1000,
      },
      width: 100,
    }],
  });
});

        </script>
    </div>
